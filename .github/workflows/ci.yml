name: Checks
# Every pull request into dev, main or a release/<version> branch must build and pass the tests that need no installed
# players or accounts, leave releases/ to the maintainer, and label a new settings migration step with the version its
# target branch builds.
# The install, in-app update and uninstall test stays in the release workflow: it installs software and takes minutes.
on:
  pull_request:
    branches: [dev, main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The checks below compare with the target branch and look for release branches and tags.
          fetch-depth: 0
      # Release notes files set the version every build takes, so only the repository owner adds or changes them.
      - name: Release notes files
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        run: |
          $changed = @(git diff --name-only "origin/$env:GITHUB_BASE_REF...HEAD" -- releases/)
          if ($LASTEXITCODE -ne 0) { throw 'The changes could not be compared with the target branch.' }
          if ($changed.Count -gt 0) { throw "Files under releases/ are changed by the maintainer only. Remove these changes: $($changed -join ', ')" }
      - name: Settings migration labels
        if: github.event_name == 'pull_request'
        run: ./scripts/Test-MigrationVersions.ps1 -TargetBranch $env:GITHUB_BASE_REF
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        id: build
        run: |
          dotnet build BrimDeck.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Core tests
        run: |
          dotnet run --project tests/BrimDeck.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Media tests
        run: |
          dotnet run --project tests/BrimDeck.MediaTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Media tests failed.' }
      # The Windows-native checks that hold on a hosted runner: WPF layout and drawing, dispatcher behaviour and the sensor guard.
      # "--hosted" leaves out what reads the machine itself (graphics adapters, the display, temperatures, power and battery),
      # which a virtual machine without a GPU or battery cannot answer for the code; a developer runs all of it without the flag.
      - name: Windows tests (hosted subset)
        run: |
          dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build -- --hosted
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
      # PRs get the same installer and portable package as a release, but only as a short-lived Actions artifact.
      # Resolve the latest version from releases/ using ReleaseVersion.targets' alpha < beta < stable ordering.
      - name: Package pull request build
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $versions = @(Get-ChildItem -LiteralPath 'releases' -Filter '*.md' -File | ForEach-Object {
              $name = $_.BaseName
              $major = 0; $minor = 0; $patch = 0; $stage = 0; $stageNumber = 0
              if ($name -match '^([0-9]+)\.([0-9]+)\.([0-9]+)
      - name: Upload pull request build
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BrimDeck-PR-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: artifacts/pr-build/*
          if-no-files-found: error
          retention-days: 14
      # Started by hand from the Actions tab: every Windows check, to see which of the left-out ones this runner can answer.
      # It never fails the run; the log is the result.
      - name: Windows tests (everything, for information)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
) {
                  $major = [long]$Matches[1]; $minor = [long]$Matches[2]; $patch = [long]$Matches[3]; $stage = 2
              } elseif ($name -match '^([0-9]+)\.([0-9]+)\.([0-9]+)-beta\.([0-9]+)
      - name: Upload pull request build
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BrimDeck-PR-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: artifacts/pr-build/*
          if-no-files-found: error
          retention-days: 14
      # Started by hand from the Actions tab: every Windows check, to see which of the left-out ones this runner can answer.
      # It never fails the run; the log is the result.
      - name: Windows tests (everything, for information)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
) {
                  $major = [long]$Matches[1]; $minor = [long]$Matches[2]; $patch = [long]$Matches[3]; $stage = 1; $stageNumber = [long]$Matches[4]
              } elseif ($name -match '^([0-9]+)\.([0-9]+)\.([0-9]+)-alpha\.([0-9]+)
      - name: Upload pull request build
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BrimDeck-PR-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: artifacts/pr-build/*
          if-no-files-found: error
          retention-days: 14
      # Started by hand from the Actions tab: every Windows check, to see which of the left-out ones this runner can answer.
      # It never fails the run; the log is the result.
      - name: Windows tests (everything, for information)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
) {
                  $major = [long]$Matches[1]; $minor = [long]$Matches[2]; $patch = [long]$Matches[3]; $stage = 0; $stageNumber = [long]$Matches[4]
              } else { return }
              [pscustomobject]@{ Name = $name; Major = $major; Minor = $minor; Patch = $patch; Stage = $stage; StageNumber = $stageNumber }
          })
          $latest = $versions | Sort-Object Major, Minor, Patch, Stage, StageNumber | Select-Object -Last 1
          if (!$latest) { throw 'No valid release version was found under releases/.' }
          $env:BUILD_VERSION = $latest.Name
          Write-Host "Packaging PR #$env:PR_NUMBER with upstream-synced version $env:BUILD_VERSION"
          $notes = Join-Path $env:RUNNER_TEMP 'pr-build-notes.md'
          $body = "# Pull request build" + [Environment]::NewLine + [Environment]::NewLine + "Automated test package for pull request #$env:PR_NUMBER. Version $env:BUILD_VERSION. This is not a public release."
          [IO.File]::WriteAllText($notes, $body, [Text.UTF8Encoding]::new($false))
          ./scripts/Publish-Release.ps1 -Version $env:BUILD_VERSION -ReleaseNotes $notes -OutputDirectory 'artifacts/pr-build'
          if ($LASTEXITCODE -ne 0) { throw 'PR packaging failed.' }
      - name: Upload pull request build
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: BrimDeck-PR-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: artifacts/pr-build/*
          if-no-files-found: error
          retention-days: 14
      # Started by hand from the Actions tab: every Windows check, to see which of the left-out ones this runner can answer.
      # It never fails the run; the log is the result.
      - name: Windows tests (everything, for information)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          dotnet run --project tests/BrimDeck.WindowsTests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }
